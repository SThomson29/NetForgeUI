services:
  netforgeui:
    build: .
    container_name: netforge-ui
    ports:
      - "5001:5000"
    environment:
      # --- Required ---
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in the environment or a .env file}"
      CONFIGGEN_REPO_URL: "https://github.com/SThomson29/NetForge.git"

      # --- Optional overrides ---
      ADMIN_PASSWORD: "changeme123"
      # PORT: "5000"
      # FLASK_DEBUG: "false"
      # ANSIBLE_IMAGE: "cytopia/ansible:latest"
      # REPO_VOLUME_NAME: "netforgeui_repo"
      # DATA_VOLUME_NAME: "netforgeui_data"

    volumes:
      - netforgeui_data:/app/service/data
      - netforgeui_repo:/app/service/configgen
      - /var/run/docker.sock:/var/run/docker.sock
      # AOS-CX .swi images for the Firmware tab. Bind mount so images
      # can be dropped in from the host without an upload.
      - ./firmware:/app/service/firmware:ro

    restart: unless-stopped

volumes:
  netforgeui_data:
    name: netforgeui_data
  netforgeui_repo:
    name: netforgeui_repo
