services:
  netforgeui:
    build: .
    container_name: netforge-ui
    ports:
      - "5001:5000"
    environment:
      # --- Required ---
      SECRET_KEY: "XdfLjM@Ug%x69q7l81c1"
      CONFIGGEN_REPO_URL: "https://github.com/SThomson29/NetForge.git"

      # --- Optional overrides ---
      ADMIN_PASSWORD: "changeme123"
      # PORT: "5000"
      # FLASK_DEBUG: "false"
      # ANSIBLE_IMAGE: "cytopia/ansible:latest"
      # REPO_VOLUME_NAME: "netforgeui_repo"
      # DATA_VOLUME_NAME: "netforgeui_data"

    volumes:
      - netforgeui_data:/app/service/data
      - netforgeui_repo:/app/service/configgen
      - /var/run/docker.sock:/var/run/docker.sock

    restart: unless-stopped

volumes:
  netforgeui_data:
    name: netforgeui_data
  netforgeui_repo:
    name: netforgeui_repo
