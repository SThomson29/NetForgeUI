services:
  networktools:
    build: .
    container_name: Network-Tools
    ports:
      - "5001:5000"
    environment:
      # --- Required ---
      SECRET_KEY: "XdfLjM@Ug%x69q7l81c1"
      CONFIGGEN_REPO_URL: "git@github.com:Network-Team-Repository/Network-ConfigGen.git"

      # --- Optional overrides ---
      ADMIN_PASSWORD: "cf238ab99"
      # PORT: "5000"
      # FLASK_DEBUG: "false"
      # SSH_KEY_PATH: "/root/.ssh/id_rsa"
      # ANSIBLE_PLAYBOOK: "ansible-playbook"

    volumes:
      # Persist user data and the cloned repo across container restarts
      - configgen_data:/app/service/data
      - configgen_repo:/app/service/configgen

      # Mount your deploy key (read-only)
      # Generate with: ssh-keygen -t ed25519 -f ./deploy_key -N ""
      # Add deploy_key.pub as a read-only deploy key in your GitHub repo settings
      - ./deploy_key/cx_configgen_deploy_key:/root/.ssh/id_rsa:ro

    restart: unless-stopped

volumes:
  configgen_data:
  configgen_repo:
