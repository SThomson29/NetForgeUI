name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Called by release.yml so an image is never published from a commit
  # whose tests fail.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (unused imports, undefined names)
        run: pyflakes app/ run.py config.py

      - name: Run unit and integration tests
        run: |
          pytest tests/ \
            -v --tb=short \
            --cov=app --cov-report=term-missing \
            --cov-fail-under=60

