name: Tests

# Once per release: on the PR into main, which tests the merged result.
# Pushes to dev, the merge itself and the tag build don't re-run the same
# code. Run it by hand from the Actions tab when wanted.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR makes the running one pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (unused imports, undefined names)
        run: pyflakes app/ run.py config.py

      - name: Run unit and integration tests
        run: |
          pytest tests/ \
            -v --tb=short \
            --cov=app --cov-report=term-missing \
            --cov-fail-under=60

