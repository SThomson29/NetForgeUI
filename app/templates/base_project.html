{% extends "base.html" %}

{% block project_nav %}
<div style="padding:8px 12px;margin:8px 8px 4px;background:#2a2a2a;border-radius:6px">
  <a href="{{ url_for('projects.projects_page') }}" style="font-size:11px;color:#888;display:flex;align-items:center;gap:4px;margin-bottom:6px">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px"><polyline points="15 18 9 12 15 6"/></svg>
    All projects
  </a>
  <div style="font-size:12px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ project_name }}</div>
</div>
<a href="{{ url_for('projects.hosts_page', project_name=project_name) }}"
   class="nav-item {% if request.endpoint == 'projects.hosts_page' %}active{% endif %}">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
  Hosts
</a>
<a href="{{ url_for('projects.editor', project_name=project_name) }}"
   class="nav-item {% if request.endpoint == 'projects.editor' %}active{% endif %}">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
  Editor
</a>
<a href="{{ url_for('projects.generate_page', project_name=project_name) }}"
   class="nav-item {% if request.endpoint == 'projects.generate_page' %}active{% endif %}">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
  Generate
</a>
<a href="{{ url_for('projects.resources_page', project_name=project_name) }}"
   class="nav-item {% if request.endpoint == 'projects.resources_page' %}active{% endif %}">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
  Resources
</a>
{% endblock %}
