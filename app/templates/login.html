<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — NetForgeUI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:#1a1a1a;background:#f5f5f4;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border:1px solid #e5e4dc;border-radius:12px;padding:32px;width:100%;max-width:360px}
h1{font-size:18px;font-weight:600;margin-bottom:4px}
p{font-size:13px;color:#888;margin-bottom:24px}
.fld{margin-bottom:14px}
label{display:block;font-size:12px;font-weight:500;color:#666;margin-bottom:4px}
input{width:100%;font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid #d1d0c9;border-radius:6px;background:#fff;color:#1a1a1a;outline:none}
input:focus{border-color:#666;box-shadow:0 0 0 2px rgba(0,0,0,0.07)}
.btn{width:100%;padding:9px;font-family:inherit;font-size:13px;font-weight:500;border:none;border-radius:6px;background:#1a1a1a;color:#fff;cursor:pointer;margin-top:6px}
.btn:hover{background:#333}
.flash{padding:10px 12px;border-radius:6px;font-size:13px;margin-bottom:16px;background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
</style>
</head>
<body>
<div class="card">
  <h1>NetForgeUI</h1>
  <p>Network Config Generation Service</p>
  {% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}
  <div class="flash">{{ message }}</div>
  {% endfor %}
  {% endwith %}
  <form method="POST">
    <div class="fld">
      <label>Username</label>
      <input type="text" name="username" autocomplete="username" autofocus required>
    </div>
    <div class="fld">
      <label>Password</label>
      <input type="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn">Log in</button>
  </form>
</div>
</body>
</html>
