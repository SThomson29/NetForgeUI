<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — NetForgeUI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/design.css') }}">
</head>
<body>

<div class="login-shell">
  <div class="login-card">

    <div class="login-logo">
      <div class="login-logo-mark">N</div>
      <div class="login-logo-text">NetForgeUI</div>
    </div>

    <div class="card">
      <div class="card-body" style="padding: 28px;">

        <h2 style="font-size:16px; font-weight:700; text-align:center; margin-bottom:4px;">Sign in</h2>
        <p style="font-size:12px; color:var(--text-tertiary); text-align:center; margin-bottom:24px;">
          Enter your credentials to continue
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, msg in messages %}
            <div class="alert alert-{{ category if category != 'message' else 'danger' }}" style="margin-bottom:20px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="15" y1="9" x2="9" y2="15"/>
                <line x1="9" y1="9" x2="15" y2="15"/>
              </svg>
              <span>{{ msg }}</span>
            </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login') }}">
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input type="text" id="username" name="username" class="form-input"
                   placeholder="Enter username" autocomplete="username" autofocus required>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" class="form-input"
                   placeholder="Enter password" autocomplete="current-password" required>
          </div>

          <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px;">
            Sign in
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
          </button>
        </form>

      </div>
    </div>

    <p style="text-align:center; font-size:11px; color:var(--text-tertiary); margin-top:20px;">
      AOS-CX Configuration Generator
    </p>

  </div>
</div>

</body>
</html>
